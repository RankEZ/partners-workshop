networks:
  lab-net:
    name: "lab-net-${PARTNER_ID}"
    driver: bridge
    ipam:
      config:
        - subnet: "${LAB_SUBNET}.0/24"

volumes:
  db-data:
    name: "db-data-${PARTNER_ID}"
  web-data:
    name: "web-data-${PARTNER_ID}"

services:
  # -----------------------------------------------------------
  # 1. Proxy Client + Linux SSH Target (jump entry point)
  # -----------------------------------------------------------
  proxy-client:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: "proxy-client-${PARTNER_ID}"
    hostname: "proxy-client-${PARTNER_ID}"
    restart: always
    privileged: true
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      lab-net:
        ipv4_address: "${LAB_SUBNET}.10"
    ports:
      - "${SSH_HOST_PORT}:22"
    environment:
      - CONTAINER_NAME=proxy-client-${PARTNER_ID}

  # -----------------------------------------------------------
  # 2. Database Target (MySQL)
  # -----------------------------------------------------------
  target-db:
    image: mysql:8.0
    container_name: "target-db-${PARTNER_ID}"
    hostname: "target-db-${PARTNER_ID}"
    restart: always
    networks:
      lab-net:
        ipv4_address: "${LAB_SUBNET}.20"
    environment:
      MYSQL_ROOT_PASSWORD: "DBRootPassword123!"
      MYSQL_DATABASE: "customer_db"
      MYSQL_USER: "app_user"
      MYSQL_PASSWORD: "AppPassword123!"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d:ro

  # -----------------------------------------------------------
  # 3. Web Application Target (login-form app + SSH for CPM-for-File)
  # -----------------------------------------------------------
  target-web:
    build:
      context: .
      dockerfile: Dockerfile.target-web
    container_name: "target-web-${PARTNER_ID}"
    hostname: "target-web-${PARTNER_ID}"
    restart: always
    networks:
      lab-net:
        ipv4_address: "${LAB_SUBNET}.30"
    ports:
      # Web app: 80 inside, published to host 8080 for laptop access.
      - "0.0.0.0:${SSH_WEB_HOST_PORT}:22"
      - "0.0.0.0:${WEB_HOST_PORT}:80"
    environment:
      DB_HOST: "target-db-${PARTNER_ID}"
      DB_PORT: "3306"
      DB_NAME: "customer_db"
      DB_USER: "app_user"
      DB_PASSWORD: "AppPassword123!"
    volumes:
      - web-data:/data